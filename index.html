<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>E-Koin UPZISNU Baleharjo</title>
<!--
  Ikon aplikasi: favicon tab browser, ikon Home Screen iOS, dan ikon
  "Buat Pintasan"/"Install" di Android & desktop Chrome. Href-nya SENGAJA
  dikosongkan di sini — begitu halaman ini dimuat, script kecil di bawah
  mengambil URL Ikon Aplikasi (yang disimpan di Google Drive lewat
  Pengaturan > Ikon Aplikasi di dalam aplikasi) langsung dari server GAS,
  lalu mengisi href-nya. Jadi kalau Admin ganti ikon lewat Pengaturan,
  ikon di sini IKUT BERUBAH otomatis — TIDAK perlu commit/push apapun ke
  sini lagi.
-->
<link rel="icon" id="appFaviconLink" href="">
<link rel="apple-touch-icon" id="appTouchIconLink" href="">
<link rel="manifest" id="appManifestLink" href="">
<meta name="theme-color" content="#0f5132">
<script>
(function(){
  // GANTI URL di sini juga kalau suatu saat deployment GAS dibuat versi/URL
  // baru (harus SAMA dengan src iframe di bawah).
  var GAS_URL = 'https://script.google.com/macros/s/AKfycbwxr2WZ9nHuXTELzNRDTPYQ57iST_Ts5ZO0AEFYNLP3RrCZsmOOMu9FrrLGAHjqu6y-/exec';

  // GET biasa (bukan POST) — dijamin tidak kena masalah CORS preflight sama
  // sekali, karena GET tanpa header khusus dianggap "simple request" oleh
  // browser. Endpoint ?rpc=getIkonAplikasi cuma mengembalikan JSON kecil
  // berisi URL Ikon Aplikasi terbaru (bukan file gambar), lihat doGet di
  // Code.gs. Endpoint ini sudah di-cache di sisi server (CacheService,
  // 10 menit) supaya panggilan ini cepat & tidak ikut menahan munculnya
  // splash "Selamat Datang" di bawah.
  fetch(GAS_URL + '?rpc=getIkonAplikasi')
    .then(function(r){ return r.json(); })
    .then(function(res){
      var url = res && res.success && res.data && res.data.iconUrl;
      if(!url) return; // belum ada ikon custom diupload — biarkan ikon bawaan browser

      document.getElementById('appFaviconLink').setAttribute('href', url);
      document.getElementById('appTouchIconLink').setAttribute('href', url);

      // Web App Manifest dibuat dinamis lewat Blob URL (bukan file
      // manifest.json terpisah) — supaya ikon "Add to Home Screen"/"Install
      // App" di Android Chrome & desktop Chrome ikut memakai ikon terbaru.
      var manifest = {
        name: 'E-Koin UPZISNU Baleharjo',
        short_name: 'E-Koin',
        start_url: GAS_URL,
        display: 'standalone',
        background_color: '#0f5132',
        theme_color: '#0f5132',
        icons: [
          { src: url, sizes: '192x192', type: 'image/png' },
          { src: url, sizes: '512x512', type: 'image/png' }
        ]
      };
      var blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
      document.getElementById('appManifestLink').setAttribute('href', URL.createObjectURL(blob));
    })
    .catch(function(){
      // Diam-diam gagal (mis. offline) — biarkan ikon bawaan browser, jangan
      // sampai mengganggu iframe utama di bawah yang tetap harus tampil.
    });
})();
</script>
<!--
  MODE PENAMPIL (iframe) — SENGAJA dibuat sesederhana mungkin.
  Halaman ini TIDAK menyimpan salinan tampilan aplikasi sama sekali; ia cuma
  menampilkan langsung isi dari deployment GAS lewat <iframe>. Jadi:
  - Update apapun (menu, fitur, tampilan) cukup dilakukan di GAS
    (Index.html) → Deploy → New Version. Vercel otomatis ikut berubah,
    tidak perlu commit/push apapun ke GitHub lagi.
  - Ikon PWA & "Add to Home Screen"/"Buat Pintasan" sudah pakai Ikon
    Aplikasi custom (bukan ikon bawaan browser lagi) — diambil lewat
    script kecil di <head> yang fetch ke server GAS, BUKAN file yang
    di-commit ke sini. Kalau Ikon Aplikasi diganti lewat Pengaturan di
    dalam aplikasi, ikon di sini ikut berubah otomatis TANPA perlu
    commit/push apapun ke sini lagi.
  - GANTI URL di bawah ini kalau suatu saat deployment GAS dibuat versi/URL
    baru.
-->
<style>
  html, body{
    margin:0; padding:0; height:100%; width:100%;
    overflow:hidden; background:#0f5132;
  }
  iframe{
    border:0; display:block; width:100%; height:100%;
  }
  /*
    SPLASH "SELAMAT DATANG" -- SEBELUMNYA halaman ini cuma <iframe> polos
    dengan background hijau solid, tanpa apa-apa lagi. Begitu dibuka,
    halaman wrapper ini sendiri (statis, di Vercel) tampil SANGAT cepat,
    tapi isi <iframe>-nya (aplikasi GAS yang sesungguhnya) butuh waktu
    untuk dimuat dari server Google (apalagi saat "cold start") -- selama
    jeda itulah yang selama ini terlihat sebagai layar hijau KOSONG (tanpa
    spinner/teks apapun), terasa seperti macet/lama.
    Splash di bawah ini SENGAJA dibuat meniru persis tampilan #loadingScreen
    di dalam aplikasi GAS-nya sendiri (ikon koin, spinner, teks "SELAMAT
    DATANG..." dengan warna & gradasi yang sama) -- supaya begitu halaman
    ini dibuka, yang terlihat BUKAN hijau kosong, melainkan LANGSUNG splash
    "Selamat Datang" yang sama persis dengan yang nanti menyambungnya dari
    dalam iframe, sehingga transisinya terasa MULUS/menyatu (serasa 1 layar
    loading yang sama terus, bukan 2 layar loading berbeda yang berganti).
    Disembunyikan otomatis begitu <iframe> selesai dimuat (lihat <script>
    di bawah, event 'load' pada iframe) -- event ini TETAP terpicu normal
    walau iframe-nya beda origin (script.google.com), browser cuma
    membatasi AKSES ISI iframe lintas-origin, bukan event load-nya.
  */
  #wrapperSplash{
    position:fixed; inset:0; z-index:9999;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:linear-gradient(135deg,#0f5132,#146c43);
    color:#fff;
    opacity:1; visibility:visible;
    transition:opacity .35s ease, visibility .35s ease;
  }
  #wrapperSplash.hide{ opacity:0; visibility:hidden; pointer-events:none; }
  #wrapperSplash .coin-icon{
    font-size:40px; margin-bottom:8px; animation:wrapperBounce 1.4s ease-in-out infinite;
    width:92px; height:92px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  @keyframes wrapperBounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
  #wrapperSplash .spinner{
    width:48px; height:48px; border:4px solid rgba(255,255,255,0.25); border-top-color:#c9a227;
    border-radius:50%; animation:wrapperSpin .9s linear infinite; margin-bottom:16px;
  }
  @keyframes wrapperSpin{to{transform:rotate(360deg);}}
  #wrapperSplash .teks{
    font-size:15px; font-weight:600; opacity:.95; text-align:center; line-height:1.5; padding:0 20px;
  }
  #wrapperSplash .teks b{ font-size:22px; font-weight:800; display:block; }
</style>
</head>
<body>
  <div id="wrapperSplash">
    <div class="coin-icon">🪙</div>
    <div class="spinner"></div>
    <div class="teks">SELAMAT DATANG DI<br><b>E-KOIN UPZISNU CARE - LAZISNU</b>DESA BALEHARJO</div>
  </div>
  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbwxr2WZ9nHuXTELzNRDTPYQ57iST_Ts5ZO0AEFYNLP3RrCZsmOOMu9FrrLGAHjqu6y-/exec"
    title="E-Koin UPZISNU Baleharjo"
    allow="clipboard-write"
    referrerpolicy="no-referrer-when-downgrade">
  </iframe>
  <script>
  (function(){
    var splash = document.getElementById('wrapperSplash');
    var frame = document.getElementById('appFrame');
    var sudahDisembunyikan = false;
    function sembunyikanSplash(){
      if(sudahDisembunyikan) return;
      sudahDisembunyikan = true;
      splash.classList.add('hide');
    }
    // Jalur utama: begitu dokumen di dalam iframe selesai dimuat (termasuk
    // kasus aplikasi GAS-nya sendiri sudah sempat menampilkan #loadingScreen
    // miliknya sendiri dan isi Dashboard/halaman sudah siap), splash wrapper
    // ini dianggap sudah tidak perlu lagi dan disembunyikan.
    frame.addEventListener('load', sembunyikanSplash);
    // Jaga-jaga (fallback): kalau karena suatu hal event 'load' tidak
    // pernah terpicu (jaringan bermasalah dsb), splash ini jangan sampai
    // nyangkut selamanya menutupi iframe -- paksa sembunyikan setelah 20
    // detik, lebih baik terlihat sedikit "gagal" daripada mengunci user
    // keluar dari aplikasi yang sebenarnya sudah termuat.
    setTimeout(sembunyikanSplash, 20000);
  })();
  </script>
</body>
</html>
