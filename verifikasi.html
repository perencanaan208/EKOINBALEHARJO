<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Verifikasi Surat - UPZISNU Desa Baleharjo</title>
<style>
*{box-sizing:border-box;} html,body{margin:0;min-height:100%;}
body{background:#dfe7e2;font-family:Arial,Helvetica,sans-serif;font-size:15px;color:#444;padding:24px 12px;}
.card{max-width:760px;margin:24px auto;background:#fff;padding:24px 24px 36px;border-radius:6px;box-shadow:0 4px 18px rgba(26,74,46,.15);}
.kop{text-align:center;padding-bottom:16px;border-bottom:3px double #1a4a2e;margin-bottom:20px;}
.kop .a{font-size:20px;font-weight:bold;color:#1a4a2e;line-height:1.2;letter-spacing:.3px;}
.kop .b{font-size:15px;font-weight:bold;color:#1a4a2e;margin-top:2px;}
.kop .c{font-size:12px;color:#666;margin-top:4px;}
h4{margin:16px 6px 4px;font-size:15px;text-decoration:underline;color:#1a4a2e;}
table{border-collapse:collapse;width:100%;} td{padding:8px 6px;vertical-align:top;color:#444;}
td.l{width:170px;} td.c{width:18px;}
ul{margin:6px 6px 0;padding-left:20px;} li{padding:4px 0;}
.box{margin-top:22px;color:#fff;font-weight:bold;font-size:16px;text-align:center;padding:26px 18px;border-radius:4px;line-height:1.4;}
.ok{background:#1f8a4c;border-left:5px solid #14652f;} .no{background:#d44a3a;border-left:5px solid #b13527;} .wait{background:#9aa3ab;}
.foot{margin-top:16px;text-align:center;font-size:11px;color:#888;}
@media(max-width:520px){.kop .a{font-size:16px;} td.l{width:100px;}}
</style></head><body>
<div class="card">
  <div class="kop">
    <div class="a">PENGURUS RANTING NAHDLATUL ULAMA</div>
    <div class="b">DESA BALEHARJO - UPZISNU CARE-LAZISNU</div>
    <div class="c">Kecamatan Sukodono, Kabupaten Sragen</div>
  </div>
  <div id="isi"></div>
  <div id="status" class="box wait">Memeriksa data surat...</div>
  <div class="foot">Verifikasi keaslian surat - Sistem Informasi E-Koin UPZISNU Baleharjo</div>
</div>
<script>
/* GANTI dengan URL Web App Apps Script E-KOIN (Deploy > Manage deployments > salin "Web app URL" yang berakhiran /exec).
   Harus sama dengan Web App yang dipakai aplikasi E-Koin, dan akses Web App-nya "Anyone" (siapa saja). */
var API_URL = 'https://script.google.com/macros/s/AKfycbwxr2WZ9nHuXTELzNRDTPYQ57iST_Ts5ZO0AEFYNLP3RrCZsmOOMu9FrrLGAHjqu6y-/exec';

function e(t) { return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function row(l, v) { return v ? '<tr><td class="l">' + l + '</td><td class="c">:</td><td>' + e(v) + '</td></tr>' : ''; }
function tglId(iso) {
  var b = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  var m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? (parseInt(m[3], 10) + ' ' + b[parseInt(m[2], 10) - 1] + ' ' + m[1]) : '-';
}
function status(cls, teks) { var s = document.getElementById('status'); s.className = 'box ' + cls; s.textContent = teks; }

(function () {
  var p = new URLSearchParams(location.search), id = p.get('id') || '', n = p.get('n') || '';
  if (!n && !id) { status('no', 'QR Code tidak valid atau tautan tidak lengkap.'); return; }
  if (API_URL.indexOf('https://') !== 0) { status('wait', 'Halaman verifikasi belum dikonfigurasi (isi API_URL di verifikasi.html).'); return; }
  fetch(API_URL + '?type=verifikasi&id=' + encodeURIComponent(id) + '&n=' + encodeURIComponent(n))
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d.status !== 'ok') throw new Error(d.message || 'error');
      if (!d.found) { status('no', 'Surat TIDAK ditemukan dalam database sistem informasi kami.'); return; }
      var ttd = (d.penandatangan || []).map(function (x) { return '<li><b>' + e(x.nama) + '</b> - ' + e(x.jabatan) + '</li>'; }).join('');
      document.getElementById('isi').innerHTML =
        '<h4>Menyatakan Bahwa :</h4><table>' +
          row('Jenis Surat', d.jenis ? 'Surat ' + d.jenis : '') + row('Nomor Surat', d.nomor) + row('Tanggal Surat', tglId(d.tgl)) +
          row('Perihal', d.perihal) + row('Acara', d.acara) + row('Hari/Tanggal Acara', d.hariTanggalAcara) + row('Tempat', d.tempat) +
        '</table>' +
        (ttd ? '<h4>Ditandatangani secara elektronik oleh :</h4><ul>' + ttd + '</ul>' : '');
      status('ok', 'Adalah benar dan tercatat dalam database sistem informasi E-Koin UPZISNU Baleharjo.');
    })
    .catch(function () { status('wait', 'Gagal menghubungi server. Periksa koneksi internet lalu muat ulang halaman.'); });
})();
</script>
</body></html>
